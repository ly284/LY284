<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnythingLLM 文档上传</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        h1 { color: #333; }
        .config-area { margin-bottom: 16px; }
        .config-area label { display: block; font-size: 14px; color: #555; margin: 8px 0 4px; }
        .config-area input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .upload-area { border: 2px dashed #ccc; padding: 30px; text-align: center; margin: 20px 0; }
        input[type="file"] { margin: 10px 0; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #result { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; white-space: pre-wrap; word-break: break-all; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>AnythingLLM 文档上传</h1>
    <div class="config-area">
        <label for="apiKeyInput">AnythingLLM API Key（仅保存在浏览器 sessionStorage，不会写入任何文件）</label>
        <input type="password" id="apiKeyInput" placeholder="粘贴你的 API Key">
        <label for="baseUrlInput">AnythingLLM 地址</label>
        <input type="text" id="baseUrlInput" value="http://localhost:3001">
        <label for="workspaceInput">工作区 ID（可选，留空则不上传到工作区）</label>
        <input type="text" id="workspaceInput" placeholder="workspace uuid 或 slug">
    </div>
    <div class="upload-area">
        <input type="file" id="fileInput">
        <br><br>
        <button id="uploadBtn" onclick="uploadFile()">上传文件</button>
    </div>
    <div id="result"></div>

    <script>
        // 密钥只保存在当前标签页的 sessionStorage 中，由用户手动输入，不在代码里写死
        const KEY_STORAGE = 'anythingllm_api_key';

        function getConfig() {
            const apiKey = (document.getElementById('apiKeyInput').value || sessionStorage.getItem(KEY_STORAGE) || '').trim();
            const baseUrl = (document.getElementById('baseUrlInput').value || 'http://localhost:3001').replace(/\/+$/, '');
            const workspaceId = document.getElementById('workspaceInput').value.trim();
            return { apiKey, baseUrl, workspaceId };
        }

        async function uploadFile() {
            const resultDiv = document.getElementById('result');
            const uploadBtn = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('fileInput');
            const { apiKey, baseUrl, workspaceId } = getConfig();

            if (!apiKey) {
                alert('请先填写 API Key（可在 AnythingLLM 设置 → API Key 中生成）');
                return;
            }
            if (!fileInput.files.length) {
                alert('请选择文件');
                return;
            }
            sessionStorage.setItem(KEY_STORAGE, apiKey);

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);
            if (workspaceId) {
                formData.append('addToWorkspaces', workspaceId);
            }

            uploadBtn.disabled = true;
            uploadBtn.textContent = '上传中…';
            resultDiv.style.display = 'none';

            try {
                const response = await fetch(`${baseUrl}/api/v1/document/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${apiKey}` },
                    body: formData
                });
                let detail = '';
                try {
                    const data = await response.json();
                    detail = data.message || (data.documents && data.documents[0] && data.documents[0].location) || '';
                } catch (_) { /* 响应体不是 JSON 时忽略 */ }
                resultDiv.className = response.ok ? 'success' : 'error';
                resultDiv.textContent = response.ok
                    ? `上传成功！${detail ? '\n文档位置: ' + detail : ''}`
                    : `上传失败: ${detail || 'HTTP ' + response.status}`;
            } catch (err) {
                resultDiv.className = 'error';
                resultDiv.textContent = `错误: ${err.message}`;
            }

            resultDiv.style.display = 'block';
            uploadBtn.disabled = false;
            uploadBtn.textContent = '上传文件';
        }
    </script>
</body>
</html>
